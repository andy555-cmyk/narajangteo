name: build-dashboard

# 코드·리포트가 바뀌면 GitHub이 직접 산출물을 다시 만들어 커밋한다.
# 목적: 대표가 맥에서 터미널을 치지 않아도 배포가 끝나게 하는 것.
#   종전 흐름 — 클로드가 코드 수정 → zip → 드라이브 → 대표가 맥에서 스크립트 실행
#   현재 흐름 — 클로드가 소스 파일만 커밋 → 이 워크플로가 index.html 등을 재생성·커밋
on:
  push:
    branches: [main]
    # ⚠ 산출물(index.html·g2b_dashboard.html·reports.html·report_*.html)은 여기 넣지 않는다.
    #   이 워크플로가 그것들을 커밋하므로, 넣으면 자기 자신을 무한히 재기동한다.
    # ⚠ 일일 갱신 봇이 만지는 데이터 파일(g2b_result.csv·attachments.json·specs.json·store.json)도
    #   넣지 않는다. 봇이 이미 자기 손으로 대시보드를 빌드하므로 중복 커밋만 생긴다.
    paths:
      - '**.py'
      - 'reports_data/**'
      - 'qualifications.json'
      - 'keywords.json'
      - 'decisions.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # 수동 실행 버튼 (Actions 탭)

concurrency:
  group: build-dashboard
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 과업분석 리포트 재생성
        run: |
          set -e
          shopt -s nullglob
          n=0
          for f in reports_data/R26BK*.json; do
            python3 build_report.py "$f" >/dev/null
            n=$((n+1))
          done
          echo "리포트 $n 건 생성"
          python3 build_bundle.py
          cp g2b_reports.html reports.html

      - name: 만료 리포트 정리
        # reports_data 에 대응 JSON 이 없는 report_*.html 은 지운다.
        # (2026-07-30 사고: 삭제분이 스테이징되지 않아 이후 pull 이 전부 막혔다)
        run: |
          shopt -s nullglob
          for f in report_R26BK*.html; do
            no="${f#report_}"; no="${no%.html}"
            [ -f "reports_data/$no.json" ] || { rm -f "$f"; echo "만료 제거: $f"; }
          done

      - name: 대시보드 재생성
        run: |
          set -e
          TOTAL=$(python3 -c "import csv;print(sum(1 for _ in csv.DictReader(open('g2b_result.csv',encoding='utf-8-sig'))))")
          # 생성시각은 KST 로 찍는다 — 종전에 UTC 로 찍혀 대표가 보는 시각과 9시간 어긋났다
          GEN=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')
          python3 build_dashboard.py "$TOTAL" "" "$GEN"
          echo "대시보드 생성 · 채택 $TOTAL 건 · 생성시각 $GEN (KST)"

      - name: 커밋·푸시
        run: |
          set -e
          git config user.name  "narajangteo-ci"
          git config user.email "ci@sigmaad.local"
          # ★ 글로브(report_*.html)를 셸에 맡기지 않는다. 따옴표로 감싸 git 이 직접 확장하게 해야
          #   '사라진 파일의 삭제'까지 스테이징된다. (2026-07-30 H-33 교훈)
          git add index.html g2b_dashboard.html reports.html g2b_reports.html
          git add -A -- 'report_R26BK*.html'
          if git diff --cached --quiet; then
            echo "산출물 변경 없음 — 커밋 생략"; exit 0
          fi
          git commit -m "산출물 자동 재생성 (CI) [skip ci]"
          git push
          echo "푸시 완료: $(git rev-parse --short HEAD)"
